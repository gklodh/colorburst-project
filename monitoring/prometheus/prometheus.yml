global:
  scrape_interval: 1s
  evaluation_interval: 1s
alerting:
  alertmanagers:
    - static_configs:
        - targets:
            - "alertmanager:9093"
rule_files:
  - "/etc/prometheus/rules/*.yml"
scrape_configs:
  - job_name: "prometheus"
    static_configs:
      - targets: ["prometheus:9090"]
  - job_name: "app"
    static_configs:
      - targets: ["10.2.2.85:9100"]
  - job_name: "db"
    static_configs:
      - targets: ["10.2.2.202:9100"]
  - job_name: "docker"
    static_configs:
      - targets: ["10.2.2.58:8080"]
  - job_name: "web"
    static_configs:
      - targets: ["10.2.2.58:9115"]
  - job_name: "webapp"
    static_configs:
      - targets: ["10.2.2.58:8000"]
