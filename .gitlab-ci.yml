stages:
  - validate
  - test
  - security
  - build
  - push
  - deploy

variables:
  IMAGE_NAME: "$CI_REGISTRY_IMAGE"
  IMAGE_TAG: "$CI_COMMIT_SHORT_SHA"

# All jobs in this pipeline run on the production runner
.default:
  tags:
    - prod

# -------------------------
# Validate
# -------------------------

validate:
  extends: .default
  stage: validate
  script:
    - echo "Validating project structure..."
    - test -f app.py
    - test -f requirements.txt
    - test -f Dockerfile
    - echo "Project validation completed successfully."
    - hostname
    - whoami

