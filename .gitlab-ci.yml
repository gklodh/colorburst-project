stages:
  - validate
  # - test
  - build
  - security
  - push
  - deploy

variables:
  IMAGE_NAME: "$CI_REGISTRY_IMAGE"
  IMAGE_TAG: "$CI_COMMIT_SHORT_SHA"

# All jobs in this pipeline run on the production runner
.default:
  tags:
    - prod

# -------------------------
# Validate
# -------------------------

validate:
  extends: .default
  stage: validate
  script:
    - echo "Validating project structure..."
    - test -f app.py
    - test -f requirements.txt
    - test -f Dockerfile
    - echo "Project validation completed successfully."
    - hostname
    - whoami

# -------------------------
# Docker Build
# -------------------------

docker_build:
  extends: .default
  stage: build
  script:
    - echo "Building Docker image..."
    - docker build --pull -t "$IMAGE_NAME:$IMAGE_TAG" .
    - docker tag "$IMAGE_NAME:$IMAGE_TAG" "$IMAGE_NAME:latest"
    - docker images "$IMAGE_NAME"


# -------------------------
# Security Scan
# -------------------------

trivy_scan:
  extends: .default
  stage: security
  script:
    - echo "Running Trivy vulnerability scan..."
    - trivy image --severity HIGH,CRITICAL "$IMAGE_NAME:$IMAGE_TAG" > secscan.txt
    - echo "Trivy security scan completed successfully."

# -------------------------
# Push to GitLab Registry
# -------------------------

docker_push:
  extends: .default
  stage: push
  script:
    - echo "Logging in to GitLab Container Registry..."
    - echo "$CI_REGISTRY_PASSWORD" | docker login "$CI_REGISTRY" --username "$CI_REGISTRY_USER" --password-stdin
    - docker push "$IMAGE_NAME:$IMAGE_TAG"
    - docker push "$IMAGE_NAME:latest"
    - echo "Docker image pushed successfully."
  when: delayed
  start_in: 1 minutes
  allow_failure: false

# -------------------------
# Production Deployment
# -------------------------

deploy:
  extends: .default
  stage: deploy
  script:
    - echo "Starting production deployment..."
    - echo "$CI_REGISTRY_PASSWORD" | docker login "$CI_REGISTRY" --username "$CI_REGISTRY_USER" --password-stdin
    - docker pull "$IMAGE_NAME:$IMAGE_TAG"

    - docker rm -f webapp 2>/dev/null || true

    - docker run -d \
        --name webapp \
        --restart unless-stopped \
        -p 8000:8000 \
        "$IMAGE_NAME:$IMAGE_TAG"

    - echo "Waiting for application startup..."
    - sleep 5

    - docker ps --filter "name=webapp"

    - echo "Running application health check..."
    - curl --fail http://localhost:8000/health

    - echo "Production deployment completed successfully."
  when: manual